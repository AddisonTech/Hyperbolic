[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperbolic"
version = "0.1.0"
description = "Supervisory setpoint control for BOPTEST building simulations, behind a deterministic safety envelope."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AddisonTech" }]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hyperbolic = "hyperbolic.cli:main"

[tool.setuptools]
packages = ["hyperbolic"]

[tool.setuptools.package-data]
hyperbolic = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
