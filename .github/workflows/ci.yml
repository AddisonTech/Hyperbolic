name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU torch, CityLearn and Hyperbolic
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps CityLearn==3.0.2
          python -m pip install -e ".[dev]"
      - name: Tests (offline, CityLearn on the shipped dataset, no API key)
        env:
          HYPERBOLIC_ANTHROPIC_KEY: ""
          TRIAGE_ANTHROPIC_KEY: ""
          CITYLEARN_OFFLINE: "1"
        run: python -m pytest -q
      - name: Repository rules
        run: python scripts/check_repo.py

  author-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every commit authored by AddisonTech
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_authors.py
